<!-- ============================================================
     SIGNUP PAGE - FirstChild Fertility
     ============================================================ -->

<section class="max-w-md mx-auto px-6 py-12 md:py-20 reveal active">
    <div class="adaptive-card p-8 md:p-12 rounded-5xl shadow-3xl relative space-y-8">
        
        <div class="absolute top-6 right-6 flex items-center gap-2">
            <button onclick="app.toggleTheme()" class="p-2 rounded-full hover:bg-neutral-200/60 dark:hover:bg-white/10 transition-all text-neutral-800 dark:text-white" title="Toggle Theme">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
            <button onclick="app.toggleDir()" class="px-2.5 py-1 text-[9px] font-black border border-neutral-200 dark:border-white/10 rounded-full hover:bg-neutral-100 dark:hover:bg-white/5 transition-all text-neutral-800 dark:text-white">
                RTL/LTR
            </button>
        </div>

        <!-- Brand - Always Visible -->
<div class="flex items-center gap-2 sm:gap-3.5 cursor-pointer group flex-shrink-0" onclick="router.navigate('home')">
    <div class="w-9 h-9 sm:w-11 sm:h-11 bg-[#0251B0] rounded-xl sm:rounded-2xl flex items-center justify-center shadow-md shadow-[#0251B0]/30 transition-all duration-300 group-hover:scale-105 group-hover:shadow-lg group-hover:shadow-[#0251B0]/40">
        <img src="./assets/images/brandlogo.png" 
             alt="FirstChild Fertility Logo" 
             class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
             onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-white font-bold text-sm sm:text-base\'>FC</span>';" />
    </div>
    <!-- Brand Name - ALWAYS VISIBLE -->
    <span class="text-base sm:text-xl font-black tracking-tight uppercase text-neutral-900 dark:text-white whitespace-nowrap">
        First<span class="text-[#0251B0] dark:text-[#D1FF42]">Child</span>
    </span>
</div>

        <!-- Error Message -->
        <div id="signup-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-400 px-4 py-3 rounded-2xl text-xs font-medium flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span id="signup-error-message">Signup failed. Please try again.</span>
        </div>

        <!-- Success Message -->
        <div id="signup-success" class="hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 px-4 py-3 rounded-2xl text-xs font-medium flex items-center gap-2">
            <i data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
            <span id="signup-success-message">Account created! Redirecting...</span>
        </div>

        <div class="text-center">
            <div class="w-16 h-16 bg-[#0251B0]/10 rounded-3xl flex items-center justify-center text-[#0251B0] dark:text-[#D1FF42] mx-auto mb-4">
                <i data-lucide="user-plus" class="w-8 h-8"></i>
            </div>
            <h2 class="text-3xl md:text-4xl font-serif font-bold mb-2">Create Account</h2>
            <p class="text-neutral-500 dark:text-[#C7D1DD] text-sm">
                Begin your journey with FirstChild Fertility today.
            </p>
        </div>

        <!-- Signup Form -->
        <form id="signup-form" onsubmit="auth.signup(event)" class="space-y-4" novalidate>
            <div>
                <label for="signup-name" class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Full Name
                </label>
                <input 
                    id="signup-name"
                    type="text" 
                    required 
                    placeholder="Enter your full name"
                    class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border-2 border-neutral-200 dark:border-white/10 focus:border-[#0251B0] dark:focus:border-[#D1FF42] focus:ring-4 focus:ring-[#0251B0]/20 dark:focus:ring-[#D1FF42]/20 transition-all outline-none text-sm text-neutral-900 dark:text-white"
                    autocomplete="name"
                />
                <div id="signup-name-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1"></div>
            </div>

            <div>
                <label for="signup-email" class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Email Address
                </label>
                <input 
                    id="signup-email"
                    type="email" 
                    required 
                    placeholder="Enter your email address"
                    class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border-2 border-neutral-200 dark:border-white/10 focus:border-[#0251B0] dark:focus:border-[#D1FF42] focus:ring-4 focus:ring-[#0251B0]/20 dark:focus:ring-[#D1FF42]/20 transition-all outline-none text-sm text-neutral-900 dark:text-white"
                    autocomplete="email"
                />
                <div id="signup-email-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1"></div>
            </div>

            <div>
                <label for="signup-password" class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Password
                </label>
                <div class="relative">
                    <input 
                        id="signup-password"
                        type="password" 
                        required 
                        placeholder="Create a secure password (min 4 chars)"
                        class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border-2 border-neutral-200 dark:border-white/10 focus:border-[#0251B0] dark:focus:border-[#D1FF42] focus:ring-4 focus:ring-[#0251B0]/20 dark:focus:ring-[#D1FF42]/20 transition-all outline-none text-sm text-neutral-900 dark:text-white pr-12"
                        autocomplete="new-password"
                    />
                    <button 
                        type="button"
                        onclick="auth.togglePasswordVisibility('signup-password', 'signup-password-toggle')"
                        class="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-full hover:bg-neutral-200 dark:hover:bg-white/10 transition-all text-neutral-500 dark:text-neutral-400"
                    >
                        <i id="signup-password-toggle" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="signup-password-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1"></div>
            </div>

            <div>
                <label for="signup-confirm" class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Confirm Password
                </label>
                <input 
                    id="signup-confirm"
                    type="password" 
                    required 
                    placeholder="Confirm your password"
                    class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border-2 border-neutral-200 dark:border-white/10 focus:border-[#0251B0] dark:focus:border-[#D1FF42] focus:ring-4 focus:ring-[#0251B0]/20 dark:focus:ring-[#D1FF42]/20 transition-all outline-none text-sm text-neutral-900 dark:text-white"
                    autocomplete="new-password"
                />
                <div id="signup-confirm-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1"></div>
            </div>

            <button 
                id="signup-submit-btn"
                type="submit" 
                class="w-full py-4 bg-[#0251B0] dark:bg-[#D1FF42] text-white dark:text-[#111318] rounded-full font-black text-[13px] uppercase tracking-widest shadow-xl shadow-[#0251B0]/30 dark:shadow-[#D1FF42]/30 hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 mt-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span id="signup-btn-text">Create Account</span>
                <i id="signup-spinner" data-lucide="loader-2" class="w-4 h-4 hidden animate-spin"></i>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-neutral-200 dark:border-white/10">
            <p class="text-xs text-neutral-500 dark:text-neutral-400">
                Already have an account? 
                <button onclick="router.navigate('login')" class="text-[#0251B0] dark:text-[#D1FF42] font-bold hover:underline transition-all">
                    Sign In
                </button>
            </p>
        </div>
    </div>
</section>
