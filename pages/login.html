<!-- ============================================================
     LOGIN PAGE - FirstChild Fertility
     ============================================================ -->

<section class="max-w-md mx-auto px-6 py-12 md:py-20 reveal active">
    <div class="adaptive-card p-8 md:p-12 rounded-5xl shadow-3xl relative space-y-8">
        
        <!-- Top-Right Utility Toggles -->
        <div class="absolute top-6 right-6 flex items-center gap-2">
            <button onclick="app.toggleTheme()" class="p-2 rounded-full hover:bg-neutral-200/60 dark:hover:bg-white/10 transition-all text-neutral-800 dark:text-white" title="Toggle Theme">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
            <button onclick="app.toggleDir()" class="px-2.5 py-1 text-[9px] font-black border border-neutral-200 dark:border-white/10 rounded-full hover:bg-neutral-100 dark:hover:bg-white/5 transition-all text-neutral-800 dark:text-white">
                RTL/LTR
            </button>
        </div>

        <!-- Brand - Always Visible -->
<div class="flex items-center gap-2 sm:gap-3.5 cursor-pointer group flex-shrink-0" onclick="router.navigate('home')">
    <div class="w-9 h-9 sm:w-11 sm:h-11 bg-[#0251B0] rounded-xl sm:rounded-2xl flex items-center justify-center shadow-md shadow-[#0251B0]/30 transition-all duration-300 group-hover:scale-105 group-hover:shadow-lg group-hover:shadow-[#0251B0]/40">
        <img src="./assets/images/brandlogo.png" 
             alt="FirstChild Fertility Logo" 
             class="w-6 h-6 sm:w-7 sm:h-7 object-contain"
             onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-white font-bold text-sm sm:text-base\'>FC</span>';" />
    </div>
    <!-- Brand Name - ALWAYS VISIBLE -->
    <span class="text-base sm:text-xl font-black tracking-tight uppercase text-neutral-900 dark:text-white whitespace-nowrap">
        First<span class="text-[#0251B0] dark:text-[#D1FF42]">Child</span>
    </span>
</div>

        <!-- Error Message -->
        <div id="login-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-400 px-4 py-3 rounded-2xl text-xs font-medium flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span id="login-error-message">Invalid credentials. Please try again.</span>
        </div>

        <!-- Success Message -->
        <div id="login-success" class="hidden bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 px-4 py-3 rounded-2xl text-xs font-medium flex items-center gap-2">
            <i data-lucide="check-circle" class="w-4 h-4 shrink-0"></i>
            <span id="login-success-message">Login successful! Redirecting...</span>
        </div>

        <!-- Social Login -->
        <div class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="auth.socialLogin('Google')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border border-neutral-200 dark:border-white/10 hover:bg-neutral-200 dark:hover:bg-white/10 transition-all text-xs font-bold text-neutral-900 dark:text-white shadow-sm">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Google
                </button>
                <button type="button" onclick="auth.socialLogin('Apple')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border border-neutral-200 dark:border-white/10 hover:bg-neutral-200 dark:hover:bg-white/10 transition-all text-xs font-bold text-neutral-900 dark:text-white shadow-sm">
                    <i data-lucide="apple" class="w-4 h-4 shrink-0"></i>
                    Apple
                </button>
            </div>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-neutral-200 dark:border-white/10"></div>
                <span class="flex-shrink mx-4 text-[10px] font-black uppercase tracking-widest text-neutral-400">Or Secure Email</span>
                <div class="flex-grow border-t border-neutral-200 dark:border-white/10"></div>
            </div>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="auth.login(event)" class="space-y-4" novalidate>
            <div>
                <label for="login-email" class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Patient ID / Email Address
                </label>
                <input 
                    id="login-email"
                    type="email" 
                    required 
                    placeholder="Enter your email address"
                    class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border-2 border-neutral-200 dark:border-white/10 focus:border-[#0251B0] dark:focus:border-[#D1FF42] focus:ring-4 focus:ring-[#0251B0]/20 dark:focus:ring-[#D1FF42]/20 transition-all outline-none text-sm text-neutral-900 dark:text-white"
                    autocomplete="email"
                />
                <div id="login-email-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1"></div>
            </div>
            
            <div>
                <label for="login-password" class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Security PIN / Password
                </label>
                <div class="relative">
                    <input 
                        id="login-password"
                        type="password" 
                        required 
                        placeholder="Enter your PIN or password"
                        class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border-2 border-neutral-200 dark:border-white/10 focus:border-[#0251B0] dark:focus:border-[#D1FF42] focus:ring-4 focus:ring-[#0251B0]/20 dark:focus:ring-[#D1FF42]/20 transition-all outline-none text-sm text-neutral-900 dark:text-white pr-12"
                        autocomplete="current-password"
                    />
                    <button 
                        type="button"
                        onclick="auth.togglePasswordVisibility('login-password', 'password-toggle-icon')"
                        class="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-full hover:bg-neutral-200 dark:hover:bg-white/10 transition-all text-neutral-500 dark:text-neutral-400"
                    >
                        <i id="password-toggle-icon" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="login-password-error" class="hidden text-red-500 text-[10px] font-medium mt-1 ml-1"></div>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input 
                        type="checkbox" 
                        id="remember-me"
                        class="w-4 h-4 rounded border-2 border-neutral-300 dark:border-neutral-600 text-[#0251B0] dark:text-[#D1FF42] focus:ring-2 focus:ring-[#0251B0]/40 dark:focus:ring-[#D1FF42]/40 cursor-pointer"
                    />
                    <span class="text-[11px] font-medium text-neutral-600 dark:text-neutral-400 group-hover:text-neutral-900 dark:group-hover:text-white transition-colors">
                        Remember me
                    </span>
                </label>
            </div>

            <button 
                id="login-submit-btn"
                type="submit" 
                class="w-full py-4 bg-[#0251B0] dark:bg-[#D1FF42] text-white dark:text-[#111318] rounded-full font-black text-[13px] uppercase tracking-widest shadow-xl shadow-[#0251B0]/30 dark:shadow-[#D1FF42]/30 hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 mt-2 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <i data-lucide="log-in" class="w-4 h-4"></i>
                <span id="login-btn-text">Authorize & Enter</span>
                <i id="login-spinner" data-lucide="loader-2" class="w-4 h-4 hidden animate-spin"></i>
            </button>
        </form>

        <!-- Action Links -->
        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-neutral-200 dark:border-white/10">
            <button 
                type="button"
                onclick="router.navigate('signup')" 
                class="py-3 adaptive-card rounded-2xl font-bold text-xs uppercase tracking-widest hover:opacity-80 transition-all text-center text-neutral-900 dark:text-white"
            >
                <i data-lucide="user-plus" class="w-3.5 h-3.5 mx-auto mb-1 text-[#0251B0] dark:text-[#D1FF42]"></i>
                Sign Up
            </button>
            <button 
                type="button"
                onclick="auth.supportHelp()" 
                class="py-3 adaptive-card rounded-2xl font-bold text-xs uppercase tracking-widest hover:opacity-80 transition-all text-center text-neutral-900 dark:text-white"
            >
                <i data-lucide="help-circle" class="w-3.5 h-3.5 mx-auto mb-1 text-[#0251B0] dark:text-[#D1FF42]"></i>
                Need Help?
            </button>
        </div>

        <!-- Demo Credentials -->
        <div class="text-center text-[10px] text-neutral-400 dark:text-neutral-500 border-t border-neutral-200 dark:border-white/10 pt-4">
            <span class="font-mono">Demo: sarah@mcallister.com / password123</span>
        </div>
    </div>
</section>
