<!-- ============================================================
     LOGIN PAGE - FirstChild Fertility
     Awwwards-Caliber High-Contrast Redesign & Balanced Layout
     ============================================================ -->

<section class="max-w-md mx-auto px-6 py-12 md:py-20 reveal active">
    <div class="adaptive-card p-8 md:p-12 rounded-5xl shadow-3xl relative space-y-8">
        
        <!-- Top-Right Utility Toggles (Theme & RTL/LTR) -->
        <div class="absolute top-6 right-6 flex items-center gap-2">
            <button onclick="app.toggleTheme()" class="p-2 rounded-full hover:bg-neutral-200/60 dark:hover:bg-white/10 transition-all text-neutral-800 dark:text-white" title="Toggle Theme">
                <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
            <button onclick="app.toggleDir()" class="px-2.5 py-1 text-[9px] font-black border border-neutral-200 dark:border-white/10 rounded-full hover:bg-neutral-100 dark:hover:bg-white/5 transition-all text-neutral-800 dark:text-white">
                RTL/LTR
            </button>
        </div>

        <!-- Brand Header Lockup -->
        <div class="flex items-center gap-3.5 cursor-pointer group pt-1" onclick="router.navigate('home')">
            <div class="w-11 h-11 bg-[#0251B0] rounded-2xl flex items-center justify-center text-[#D1FF42] shadow-md shadow-[#0251B0]/30 transition-transform duration-300 group-hover:scale-105 shrink-0">
                <img src="assets/images/brandlogo.png" alt="FirstChild Logo" class="w-5 h-5 object-contain brightness-0 invert">
            </div>
            <div class="flex flex-col">
                <span class="text-xl font-black tracking-tight uppercase text-neutral-900 dark:text-white leading-tight">First<span class="text-[#0251B0] dark:text-[#D1FF42]">Child</span></span>
                <span class="text-[9px] font-mono tracking-[0.2em] uppercase text-neutral-500 dark:text-[#C7D1DD]">Patient Gateway</span>
            </div>
        </div>

        <!-- Social / Alternative Credentials -->
        <div class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="auth.socialLogin('Google')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border border-neutral-200 dark:border-white/10 hover:opacity-80 transition-all text-xs font-bold text-neutral-900 dark:text-white shadow-sm">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Google
                </button>
                <button type="button" onclick="auth.socialLogin('Apple')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border border-neutral-200 dark:border-white/10 hover:opacity-80 transition-all text-xs font-bold text-neutral-900 dark:text-white shadow-sm">
                    <i data-lucide="apple" class="w-4 h-4 shrink-0"></i>
                    Apple
                </button>
            </div>

            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-neutral-200 dark:border-white/10"></div>
                <span class="flex-shrink mx-4 text-[10px] font-black uppercase tracking-widest text-neutral-400">Or Secure Email</span>
                <div class="flex-grow border-t border-neutral-200 dark:border-white/10"></div>
            </div>
        </div>

        <!-- Login Form -->
        <form onsubmit="auth.login(event)" class="space-y-4">
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Patient ID / Email Address
                </label>
                <input 
                    type="email" 
                    required 
                    value="sarah@mcallister.com" 
                    class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border border-neutral-200 dark:border-white/10 focus:ring-2 focus:ring-[#0251B0] dark:focus:ring-[#D1FF42] transition-all outline-none text-sm text-neutral-900 dark:text-white"
                    placeholder="Enter your email"
                />
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest mb-1.5 ml-1 text-neutral-500 dark:text-neutral-400">
                    Security PIN / Password
                </label>
                <input 
                    type="password" 
                    required 
                    value="••••••••" 
                    class="w-full px-4 py-3.5 rounded-2xl bg-neutral-100 dark:bg-white/[0.03] border border-neutral-200 dark:border-white/10 focus:ring-2 focus:ring-[#0251B0] dark:focus:ring-[#D1FF42] transition-all outline-none text-sm text-neutral-900 dark:text-white"
                    placeholder="Enter your PIN"
                />
            </div>
            <button 
                type="submit" 
                class="w-full py-4 bg-[#0251B0] dark:bg-[#D1FF42] text-white dark:text-[#111318] rounded-full font-black text-[13px] uppercase tracking-widest shadow-xl hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2 mt-2"
            >
                <i data-lucide="log-in" class="w-4 h-4"></i>
                Authorize & Enter
            </button>
        </form>

        <!-- Action Links -->
        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-neutral-200 dark:border-white/10">
            <button 
                type="button"
                onclick="router.navigate('signup')" 
                class="py-3 adaptive-card rounded-2xl font-bold text-xs uppercase tracking-widest hover:opacity-80 transition-all text-center text-neutral-900 dark:text-white"
            >
                <i data-lucide="user-plus" class="w-3.5 h-3.5 mx-auto mb-1 text-[#0251B0] dark:text-[#D1FF42]"></i>
                Sign Up
            </button>
            <button 
                type="button"
                onclick="app.toast('Please call our support team for account recovery.')" 
                class="py-3 adaptive-card rounded-2xl font-bold text-xs uppercase tracking-widest hover:opacity-80 transition-all text-center text-neutral-900 dark:text-white"
            >
                <i data-lucide="help-circle" class="w-3.5 h-3.5 mx-auto mb-1 text-[#0251B0] dark:text-[#D1FF42]"></i>
                Need Help?
            </button>
        </div>
    </div>
</section>
